name: Security Scanning

# Comprehensive security analysis workflow - Updated
on:
  push:
    branches: [ main, AI_service_dev, AI_service, develop ]
  pull_request:
    branches: [ main, AI_service, develop ]
  schedule:
    # Daily security scans at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python, javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Run Semgrep SAST
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/python
          p/javascript
          p/dockerfile
          p/kubernetes
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    - name: Secret Detection with TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Secret Detection with Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

    - name: Setup Python for Security Tools
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Dependency Vulnerability Scan - Python
      run: |
        pip install safety
        find . -name requirements.txt -exec safety check -r {} \;

    - name: Setup Node.js for Security Tools
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Dependency Vulnerability Scan - Node.js
      if: hashFiles('**/package.json') != ''
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    - name: OSV Scanner
      run: |
        # Install OSV Scanner
        curl -L https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
        chmod +x osv-scanner
        
        # Run OSV Scanner
        ./osv-scanner --recursive --skip-git .

    - name: License Compliance Check
      continue-on-error: true
      if: secrets.FOSSA_API_KEY != ''
      uses: fossa-contrib/fossa-action@v2
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
        
    - name: Container Security Scan
      if: hashFiles('**/Dockerfile*') != ''
      run: |
        # Install Trivy
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy
        
        # Scan Dockerfiles with STRICT security standards
        find . -name "Dockerfile*" -exec trivy fs --security-checks vuln,config --severity HIGH,CRITICAL {} \;

    - name: Dockerfile Linting
      if: hashFiles('**/Dockerfile*') != ''
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: "projects/*/Dockerfile*"
        recursive: true
