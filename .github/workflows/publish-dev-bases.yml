name: Publish dev base images to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push python-slim-dev
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/dev-base/python-slim-base.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runecore/python-slim-dev:latest

      - name: Build and push python-alpine-dev
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/dev-base/python-alpine-base.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runecore/python-alpine-dev:latest

      - name: Build and push node-dev
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/dev-base/node-base.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runecore/node-dev:latest

      - name: Build and push rust-builder-dev
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/dev-base/rust-builder-base.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/runecore/rust-builder-dev:latest
