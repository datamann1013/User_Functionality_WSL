name: CI

on:
  push:
    branches: [ main, RuneCore_Core ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install APT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev sqlite3 ca-certificates curl

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cargo build & test (guarded)
        run: |
          if [ -f "$GITHUB_WORKSPACE/Cargo.toml" ]; then
            echo "Cargo.toml found — running cargo test"
            cargo test --workspace --verbose
          else
            echo "No Cargo.toml present — skipping Rust tests"
          fi

      - name: Build Docker image for integration test
        run: |
          docker build -t runecore-core:ci -f projects/core/Dockerfile projects/core

      - name: Run integration script
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          bash projects/core/test/run_integration.sh
