name: Build and Push Docker Images

on:
  push:
    branches: [ main, AI_service_dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: errorlogger
            dockerfile: projects/ErrorLogger/Dockerfile
            context: .
          - name: backend
            dockerfile: projects/ai_service/docker/Dockerfile.backend
            context: .
          - name: frontend
            dockerfile: projects/ai_service/docker/Dockerfile.frontend
            context: .

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.service.context }}
        file: ${{ matrix.service.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-compose:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create release artifact
      run: |
        mkdir -p release
        cp docker/docker-compose.prod.yml release/
        
        # Create version info
        echo "RUNECORE_VERSION=${GITHUB_REF_NAME:-latest}" > release/.env
        echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> release/.env
        echo "GIT_COMMIT=${GITHUB_SHA}" >> release/.env

    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: runecore-docker-${{ github.ref_name || 'latest' }}
        path: release/
