[package]
name = "runecore_core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
rand = "0.8"
openssl = { version = "0.10", features = ["rsa", "pem", "x509"] }
aes-gcm = "0.10"
pbkdf2 = "0.11"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
parking_lot = "0.12"
