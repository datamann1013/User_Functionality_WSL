[package]
name = "runecore_core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7"
rand = "0.8"
openssl = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.11"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
parking_lot = "0.12"
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
anyhow = "1.0"
getrandom = "0.2"
uuid = { version = "1.4", features = ["v4"] }
