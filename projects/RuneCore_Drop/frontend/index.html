<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RuneDrop — Frontend</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
      .qr { border: 1px solid #ddd; padding: 8px; display:inline-block }
      .log { white-space: pre-wrap; background:#f7f7f7; padding:8px; border:1px solid #eee; height:200px; overflow:auto }
    </style>
  </head>
  <body>
    <div id="app">
      <h2>RuneDrop — Minimal Frontend</h2>
      <div>
        <label>Mode: <select id="modeSelect">
          <option value="http">HTTP relay</option>
          <option value="p2p">P2P (WebRTC)</option>
        </select></label>
      </div>

      <div style="margin-top:10px">
        <label>External base: <select id="externalSelect"><option value="">(auto)</option></select></label>
        <input id="externalManual" placeholder="or paste custom base (http://10.0.1.9:5010)" style="width:320px;margin-left:8px" />
      </div>

      <div style="margin-top:10px">
        <input id="fileInput" type="file" />
      </div>

      <div style="margin-top:10px">
        <button id="uploadBtn">Upload (HTTP)</button>
        <button id="p2pSendBtn">Start P2P as Sender</button>
        <button id="p2pRecvBtn">Start P2P as Receiver</button>
      </div>

      <div id="resultArea" style="margin-top:10px"></div>

      <h4>Log</h4>
      <div id="log" class="log">Ready.</div>
    </div>

    <script>
    (function(){
      const modeSelect = document.getElementById('modeSelect');
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const p2pSendBtn = document.getElementById('p2pSendBtn');
      const p2pRecvBtn = document.getElementById('p2pRecvBtn');
      const resultArea = document.getElementById('resultArea');
      const logEl = document.getElementById('log');

      let pc = null;
      let dc = null;
      let currentFile = null;
      let fileId = null;
      let signalIndex = 0;

      function log(s){ logEl.textContent += '\n' + s; logEl.scrollTop = logEl.scrollHeight; }

      uploadBtn.addEventListener('click', async ()=>{
        const f = fileInput.files[0];
        if(!f) return alert('Choose a file first');
        log('Uploading file (HTTP relay)...');
        const fd = new FormData(); fd.append('file', f, f.name);
        const extManual = document.getElementById('externalManual').value.trim();
        const extSelect = document.getElementById('externalSelect').value;
        const chosen = extManual || extSelect || null;
        let url = '/upload'; if(chosen) url += '?external_base=' + encodeURIComponent(chosen);
        try{
          const resp = await fetch(url, {method:'POST', body: fd});
          if(!resp.ok) throw new Error('upload failed: ' + resp.status);
          const j = await resp.json();
          fileId = j.file_id;
          resultArea.innerHTML = `<div><div>File ID: ${escapeHtml(j.file_id)}</div><div>Download URL: <a href="${escapeHtml(j.download_url)}">${escapeHtml(j.download_url)}</a></div><div class='qr'>${j.qr_svg}</div></div>`;
          log('Upload complete. File ID: ' + j.file_id);
        }catch(e){ log('Upload error: ' + e); }
      });

      p2pSendBtn.addEventListener('click', async ()=>{
        const f = fileInput.files[0];
        if(!f) return alert('Choose a file first');
        currentFile = f;
        log('Creating file entry (placeholder upload)');
        const fd = new FormData(); fd.append('file', new Blob(['placeholder']), 'placeholder.txt');
        const extManual = document.getElementById('externalManual').value.trim();
        const extSelect = document.getElementById('externalSelect').value;
        const chosen = extManual || extSelect || null;
        let url = '/upload'; if(chosen) url += '?external_base=' + encodeURIComponent(chosen);
        try{
          const resp = await fetch(url, {method:'POST', body: fd});
          const j = await resp.json();
          fileId = j.file_id;
          resultArea.innerHTML = `<div><div>File ID: ${escapeHtml(j.file_id)}</div><div class='qr'>${j.qr_svg}</div></div>`;
          log('Created file id ' + j.file_id + '. Starting WebRTC');

          pc = new RTCPeerConnection();
          dc = pc.createDataChannel('file');
          dc.onopen = ()=>{ log('Data channel open — sending file'); sendFileChunks(); };
          dc.onclose = ()=> log('Data channel closed');

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          await fetch('/signal/' + fileId, {method:'POST', body: JSON.stringify({type:'offer', sdp: offer.sdp}), headers: {'Content-Type':'application/json'}});
          log('Offer posted. Polling for answer...');
          pollSignals();
        }catch(e){ log('P2P sender error: ' + e); }
      });

      p2pRecvBtn.addEventListener('click', async ()=>{
        const fid = prompt('Enter file id (or paste from QR link)');
        if(!fid) return; fileId = fid; log('Receiver connecting to file ' + fid);
        try{
          // poll for offer
          let offer = null;
          while(!offer){
            const res = await fetch('/signal/' + fid + '?from=0');
            const j = await res.json();
            if(j.messages && j.messages.length){
              for(const m of j.messages){
                const parsed = JSON.parse(m);
                if(parsed.type === 'offer') offer = parsed;
              }
            }
            if(!offer) await new Promise(r=>setTimeout(r, 800));
          }
          log('Offer received — creating answer');
          pc = new RTCPeerConnection();
          pc.ondatachannel = (ev)=>{
            const ch = ev.channel; log('Data channel received');
            let received = [];
            ch.onmessage = (ev2)=>{
              if(typeof ev2.data === 'string' && ev2.data === '__END__'){
                const blob = new Blob(received);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'received.bin'; a.textContent = 'Download received file'; resultArea.appendChild(a);
                log('File received — download link created');
                received = [];
              } else {
                received.push(ev2.data);
              }
            };
          };
          await pc.setRemoteDescription({type:'offer', sdp: offer.sdp});
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await fetch('/signal/' + fid, {method:'POST', body: JSON.stringify({type:'answer', sdp: answer.sdp}), headers: {'Content-Type':'application/json'}});
          log('Answer posted');
        }catch(e){ log('P2P receiver error: ' + e); }
      });

      async function pollSignals(){
        if(!fileId) return;
        try{
          const res = await fetch('/signal/' + fileId + '?from=' + signalIndex);
          const j = await res.json();
          if(j.messages && j.messages.length){
            for(const m of j.messages){
              const parsed = JSON.parse(m);
              if(parsed.type === 'answer'){
                log('Got answer — setting remote description');
                if(pc) pc.setRemoteDescription({type:'answer', sdp: parsed.sdp});
              }
            }
            signalIndex += j.messages.length;
          }
        }catch(e){ log('poll error: ' + e); }
        setTimeout(pollSignals, 1500);
      }

      function sendFileChunks(){
        if(!dc || !currentFile) return;
        const chunkSize = 64*1024;
        const reader = new FileReader();
        let offset = 0;
        reader.onload = (e)=>{
          dc.send(e.target.result);
          offset += e.target.result.byteLength;
          log('Sent ' + offset + ' bytes');
          if(offset < currentFile.size) readSlice(offset); else { dc.send('__END__'); log('Send complete'); }
        };
        function readSlice(o){ const slice = currentFile.slice(o, o + chunkSize); reader.readAsArrayBuffer(slice); }
        readSlice(0);
      }

      function escapeHtml(s){ return String(s).replace(/[&<>\"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

      // load interface candidates
      (async function(){
        try{
          const r = await fetch('/interfaces');
          if(!r.ok) return;
          const j = await r.json();
          if(j.candidates && j.candidates.length){
            const sel = document.getElementById('externalSelect');
            for(const c of j.candidates){
              const opt = document.createElement('option'); opt.value = c; opt.textContent = c; sel.appendChild(opt);
            }
          }
        }catch(e){ log('interfaces load error: ' + e); }
      })();
    })();
    </script>
  </body>
</html>
