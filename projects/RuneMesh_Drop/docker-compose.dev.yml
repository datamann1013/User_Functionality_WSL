services:
  mesh_drop:
    build: .
    container_name: mesh_drop
    ports:
      - "5100:5010"
    environment:
      - PORT=5010
      - RUNECORE_CORE_URL=http://runecore_core:11441
      - RUNECORE_ALLOW_INSECURE_REGISTRATION=true
    networks:
      runecore_dev:
        aliases:
          - mesh_drop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  runecore_dev:
    external: true
