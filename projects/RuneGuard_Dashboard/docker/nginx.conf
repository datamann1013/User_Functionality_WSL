server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (mirrors the Vite dev proxy /api -> dashboard_backend:5004)
    location /api/ {
        proxy_pass http://dashboard_backend:5004/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health endpoint proxy
    location /health {
        proxy_pass http://dashboard_backend:5004/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
