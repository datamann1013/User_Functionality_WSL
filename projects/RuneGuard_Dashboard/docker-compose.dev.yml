version: '3.8'
services:
  dashboard_backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dashboard_backend
    ports:
      - '5004:5004'
    environment:
      - RUNECORE_CORE_URL=http://runecore_core:11441
      - CORE_PROXY_URL=http://runecore_core:11441/api/proxy/CoreMemoryAPI
    networks:
      runecore_dev:
        aliases:
          - dashboard_backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard_frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dashboard_frontend
    ports:
      - '3001:3001'
    depends_on:
      - dashboard_backend
    networks:
      runecore_dev:
        aliases:
          - dashboard_frontend
    restart: unless-stopped

networks:
  runecore_dev:
    external: true
