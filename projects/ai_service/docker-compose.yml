services:
  # PostgreSQL Database (optimized)
  postgres:
    image: postgres:15-alpine
    container_name: ai_service_postgres
    environment:
      POSTGRES_DB: ai_service
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_secure_pass_2025
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ai_service_network
    restart: unless-stopped
    # Optimized resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_service"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis (optimized)
  redis:
    image: redis:7-alpine
    container_name: ai_service_redis
    command: redis-server --appendonly yes --requirepass redis_secure_2025 --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ai_service_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ErrorLogger Service (optimized)
  errorlogger:
    build:
      context: ../..
      dockerfile: ./projects/ai_service/docker/Dockerfile.errorlogger.optimized
    container_name: ai_service_errorlogger
    environment:
      - SERVICE_PORT=5001
      - LOG_LEVEL=INFO
      - LOG_DIRECTORY=/app/logs
    volumes:
      - ./logs:/app/logs:rw
    ports:
      - "5001:5001"
    networks:
      - ai_service_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 60s
      timeout: 5s
      retries: 2

  # Backend API Service (optimized)
  backend:
    build:
      context: ../..
      dockerfile: ./projects/ai_service/docker/Dockerfile.backend.optimized
    container_name: ai_service_backend
    environment:
      - DATABASE_URL=postgresql://ai_user:ai_secure_pass_2025@postgres:5432/ai_service
      - REDIS_URL=redis://:redis_secure_2025@redis:6379/0
      - ERRORLOGGER_URL=http://errorlogger:5001/log
      - OLLAMA_SERVICE_URL=http://172.20.0.1:5002
      - JWT_SECRET_KEY=jwt_super_secure_key_2025_change_in_production
      - FLASK_ENV=production
      - SERVICE_PORT=5000
      - LOG_DIRECTORY=/app/logs
    volumes:
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    ports:
      - "5000:5000"
    networks:
      - ai_service_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      errorlogger:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 60s
      timeout: 5s
      retries: 2

  # Ollama Service Wrapper (optimized)
  ollama_service:
    build:
      context: ../..
      dockerfile: ./projects/ai_service/docker/Dockerfile.ollama.optimized
    container_name: ai_service_ollama
    network_mode: "host"
    environment:
      - OLLAMA_HOST=http://localhost:11434
      - ERRORLOGGER_URL=http://localhost:5001/log
      - SERVICE_PORT=5002
      - LOG_DIRECTORY=/app/logs
    volumes:
      - ./logs:/app/logs:rw
    depends_on:
      - errorlogger
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 60s
      timeout: 5s
      retries: 2

  # Frontend React App (optimized with nginx)
  frontend:
    build:
      context: ../..
      dockerfile: ./projects/ai_service/docker/Dockerfile.frontend.optimized
    container_name: ai_service_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - NODE_ENV=production
      - GENERATE_SOURCEMAP=false
    ports:
      - "3000:3000"
    networks:
      - ai_service_network
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 60s
      timeout: 3s
      retries: 2

# Optimized Network
networks:
  ai_service_network:
    driver: bridge
    name: ai_service_network
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

# Persistent Storage
volumes:
  postgres_data:
    name: ai_service_postgres_data
  redis_data:
    name: ai_service_redis_data
