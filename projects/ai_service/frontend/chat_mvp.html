<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Service MVP - Chat Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #36393f;
            color: #dcddde;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: #2f3136;
            padding: 15px 20px;
            border-bottom: 1px solid #202225;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .status {
            background: #3ba55c;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message.user .avatar {
            background: #ed4245;
        }
        
        .message-content {
            flex: 1;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        
        .username {
            font-weight: 600;
            font-size: 16px;
        }
        
        .timestamp {
            font-size: 12px;
            color: #72767d;
        }
        
        .message-text {
            font-size: 16px;
            line-height: 1.375;
            word-wrap: break-word;
        }
        
        .input-area {
            padding: 20px;
            background: #40444b;
        }
        
        .input-container {
            background: #484c52;
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .message-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #dcddde;
            font-size: 16px;
            resize: none;
            max-height: 144px;
        }
        
        .message-input::placeholder {
            color: #72767d;
        }
        
        .send-button {
            background: #5865f2;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .send-button:hover {
            background: #4752c4;
        }
        
        .send-button:disabled {
            background: #72767d;
            cursor: not-allowed;
        }
        
        .typing {
            padding: 0 20px 10px;
            color: #72767d;
            font-size: 14px;
        }
        
        .error {
            background: #ed4245;
            color: white;
            padding: 10px;
            margin: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .model-info {
            background: #5865f2;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Service MVP</h1>
        <div class="status" id="status">Connecting...</div>
        <div class="model-info" id="modelInfo">Loading models...</div>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message">
                <div class="avatar">🤖</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="username">AI Assistant</span>
                        <span class="timestamp">Just now</span>
                    </div>
                    <div class="message-text">
                        Welcome to the AI Service MVP! I'm running in demonstration mode. 
                        This interface shows how the full system would work with real AI models.
                        Try sending me a message!
                    </div>
                </div>
            </div>
        </div>
        
        <div class="typing" id="typing" style="display: none;">
            AI is typing...
        </div>
        
        <div class="input-area">
            <div class="input-container">
                <textarea 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Message AI Assistant..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton" onclick="sendMessage()">
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentModel = 'mvp-demo';
        
        // Auto-resize textarea
        const messageInput = document.getElementById('messageInput');
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 144) + 'px';
        });
        
        // Send message on Enter (but allow Shift+Enter for new lines)
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Initialize
        checkBackendStatus();
        loadModels();
        
        async function checkBackendStatus() {
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    document.getElementById('status').textContent = 'Online';
                    document.getElementById('status').style.background = '#3ba55c';
                } else {
                    throw new Error('Backend not responding');
                }
            } catch (error) {
                document.getElementById('status').textContent = 'Offline';
                document.getElementById('status').style.background = '#ed4245';
                showError('Cannot connect to backend. Make sure the AI service is running.');
            }
        }
        
        async function loadModels() {
            try {
                const response = await fetch('/api/models');
                const models = await response.json();
                
                if (models && models.length > 0) {
                    const modelInfo = document.getElementById('modelInfo');
                    modelInfo.textContent = `Model: ${models[0].name}`;
                    currentModel = models[0].id;
                }
            } catch (error) {
                console.error('Failed to load models:', error);
                document.getElementById('modelInfo').textContent = 'Models unavailable';
            }
        }
        
        function addMessage(text, isUser = false, timestamp = null) {
            const messages = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : ''}`;
            
            const now = timestamp || new Date();
            const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            messageDiv.innerHTML = `
                <div class="avatar">${isUser ? 'U' : '🤖'}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="username">${isUser ? 'You' : 'AI Assistant'}</span>
                        <span class="timestamp">${timeStr}</span>
                    </div>
                    <div class="message-text">${text}</div>
                </div>
            `;
            
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        }
        
        function showTyping() {
            document.getElementById('typing').style.display = 'block';
        }
        
        function hideTyping() {
            document.getElementById('typing').style.display = 'none';
        }
        
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            document.querySelector('.chat-container').insertBefore(errorDiv, document.querySelector('.input-area'));
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
        
        async function sendMessage() {
            const input = messageInput;
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage(message, true);
            input.value = '';
            input.style.height = 'auto';
            
            // Disable send button and show typing
            const sendButton = document.getElementById('sendButton');
            sendButton.disabled = true;
            showTyping();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        model_id: currentModel
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.response) {
                    // Simulate typing delay for better UX
                    setTimeout(() => {
                        hideTyping();
                        addMessage(data.response);
                        sendButton.disabled = false;
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
                
            } catch (error) {
                hideTyping();
                showError(`Failed to send message: ${error.message}`);
                sendButton.disabled = false;
            }
        }
        
        // Periodically check backend status
        setInterval(checkBackendStatus, 30000);
    </script>
</body>
</html>
