[package]
name = "runecore_sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
sysinfo = { version = "0.29", features = ["multithread"] }
directories = "5.0"
log = "0.4"
env_logger = "0.10"
named_pipe = "0.4"
serde_json = "1.0"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
