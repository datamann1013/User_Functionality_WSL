version: '3.8'
services:
  backend:
    build:
      context: ../../
      dockerfile: projects/RuneCore_AI/docker/Dockerfile.backend.dev
    ports:
      - '5000:5000'
    networks:
      # Backend is on AI net only — reaches Core and RuneGuard via runecore_ai_net (both are on it)
      runecore_ai_net:
        aliases:
          - ai_backend
    environment:
      - PYTHONUNBUFFERED=1
      - ERRORLOGGER_URL=http://runeguard:5001
      # Cross-VLAN: CoreMemory access goes through Core's internal HTTP proxy
      - CORE_MEMORY_URL=http://runecore_core:11441/api/proxy/CoreMemoryAPI
      - OLLAMA_SERVICE_URL=http://ollama_wrapper:5002
      - OLLAMA_AUTO_PULL=1
      - OLLAMA_AUTO_PULL_WAIT=30
      - LOCAL_CACHE_ENABLED=true
      - LOCAL_CACHE_MESSAGE_LIMIT=10
      - LOCAL_CACHE_CONTEXT_SIZE=5
      - LOCAL_CACHE_FALLBACK_FILE=/app/backend/data/fallback_cache.json
      # Register with Core for service discovery
      - RUNECORE_CORE_URL=http://runecore_core:11441
      - RUNECORE_REGISTER_WITH_CORE=true
    volumes:
      - backend_data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - '3000:3000'
    networks:
      # Frontend only needs AI net — talks to backend within the VLAN
      runecore_ai_net:
        aliases:
          - ai_frontend
    environment:
      REACT_APP_API_URL: ""
      REACT_APP_MODEL_RETRY_MAX: "6"
      REACT_APP_MODEL_RETRY_BASE_MS: "2000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 15s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: runecore-ollama
    restart: unless-stopped
    networks:
      # Ollama stays within AI net — only accessible to AI components
      runecore_ai_net:
        aliases:
          - ollama
    volumes:
      - ollama_data:/root/.ollama
    # NVIDIA GPU passthrough — Ollama auto-detects GPU and uses it for inference.
    # Falls back to CPU silently if GPU is unavailable.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama_wrapper:
    build:
      context: ./ollama_service
      dockerfile: Dockerfile
    container_name: runecore-ollama-wrapper
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PORT=5002
      # ONNX backend — set to http://onnx_service:5006 when running with --profile npu
      # For native DirectML access: http://host.docker.internal:5006
      - ONNX_SERVICE_URL=${ONNX_SERVICE_URL:-}
      - ONNX_REQUEST_TIMEOUT=120
      # Marshal — native host action daemon (runs on Windows host at port 11443)
      # Set MARSHAL_URL=https://host.docker.internal:11443 to enable.
      # Certs are volume-mounted from runecore_certs volume (populated by RuneCore_Core CA).
      - MARSHAL_URL=${MARSHAL_URL:-}
      - MARSHAL_CERT_PATH=/certs/ollama_wrapper.crt
      - MARSHAL_KEY_PATH=/certs/ollama_wrapper.key
      - MARSHAL_CA_PATH=/certs/ca.crt
      - MARSHAL_AUTO_SETUP=${MARSHAL_AUTO_SETUP:-false}
      # CoreMemory — used to fetch Sentinel hardware profile for hardware optimisation
      - CORE_MEMORY_URL=http://runecore_core:11441/api/proxy/CoreMemoryAPI
    ports:
      - "5002:5002"
    networks:
      # Wrapper stays within AI net — only accessible to AI components
      runecore_ai_net:
        aliases:
          - ollama_wrapper
    volumes:
      # Mount RuneCore CA certs for mTLS calls to Marshal
      # Populate this volume from RuneCore_Core's CA after issuing an ollama_wrapper cert
      - runecore_certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ONNX inference service for NPU/DirectML models.
  # Only starts when the "npu" profile is active:
  #   docker compose --profile npu up -d
  #
  # NOTE: This container uses CPU-only onnxruntime (DirectML not available in Linux containers).
  # For actual NPU/DirectML acceleration, run the service natively:
  #   cd onnx_service && .\run_native.ps1
  # Then set ONNX_SERVICE_URL=http://host.docker.internal:5006 in the ollama_wrapper env above.
  onnx_service:
    build:
      context: ./onnx_service
      dockerfile: Dockerfile
    container_name: runecore-onnx-service
    profiles:
      - npu
    ports:
      - "5006:5006"
    networks:
      runecore_ai_net:
        aliases:
          - onnx_service
    environment:
      - PORT=5006
      - ONNX_MODEL_DIR=/models
      - ONNX_DEVICE=cpu
      # Set to auto-load a model on startup, e.g. phi3-mini-onnx
      - ONNX_MODEL_NAME=${ONNX_MODEL_NAME:-}
    volumes:
      - onnx_models:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  runecore_ai_net:
    external: true

volumes:
  ollama_data:
    name: runecore_ollama_data
  backend_data:
    name: runecore_ai_backend_data
  onnx_models:
    name: runecore_onnx_models
  runecore_certs:
    name: runecore_certs
    # external: true — switched to auto-created volume; Marshal cert provisioning is Phase 2.
    # When Marshal certs are issued, pre-create the volume and restore external: true.
