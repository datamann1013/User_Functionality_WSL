[package]
name = "runecore_marshal"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "runecore_marshal"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# TLS / mTLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2"
x509-parser = "0.16"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# HTTP client (for Core registration + CoreMemory queries)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Process spawning
which = "6"

# Time
chrono = { version = "0.4", features = ["serde"] }
