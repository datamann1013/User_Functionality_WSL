version: '3.8'
services:
  core:
    build: .
    ports:
      - '11440:11440'
    environment:
      - RUNECORE_MODE=development
      - RUNECORE_CA_PASSPHRASE=runecore-dev
      - RUNECORE_DISABLE_MTLS=1
      - RUST_LOG=info
    networks:
      runecore_dev:
        aliases:
          - runecore_core
    volumes:
      - runecore_core_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:11440/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  runecore_dev:
    external: true

volumes:
  runecore_core_data:
