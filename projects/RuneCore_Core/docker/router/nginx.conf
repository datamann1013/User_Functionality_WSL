user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server {
        listen 80;
        server_name _;

        # Root redirect to the AI frontend
        location = / {
            return 302 /ai/;
        }

    # Global upload-friendly settings
    client_max_body_size 100M;

    # Exact /ai/ and any /ai/* -> AI frontend (use service alias `ai_frontend` on the shared network)
        location /ai/ {
            proxy_pass http://ai_frontend:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # AI static assets (some builds reference /static/ absolute path)
        location /static/ {
            proxy_pass http://ai_frontend:3000/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Exact /drop/ -> serve RuneDrop frontend index (use service alias `mesh_drop` on the shared network)
        location = /drop/ {
            proxy_pass http://mesh_drop:5010/frontend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Any /drop/* request should be proxied to the RuneDrop backend root
        # so that /drop/upload -> upstream /upload, /drop/download/... -> /download/...
        location /drop/ {
            proxy_pass http://mesh_drop:5010/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Allow streaming uploads without buffering in nginx
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_set_header Connection "";
        }

        # Support frontends that POST to /upload or GET /download/* as absolute paths
        # by proxying them to the mesh_drop service as well.
        location = /upload {
            proxy_pass http://mesh_drop:5010/upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Important for multipart streaming uploads
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_set_header Connection "";
        }

        location /download/ {
            proxy_pass http://mesh_drop:5010/download/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
