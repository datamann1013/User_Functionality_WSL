version: '3.8'
services:
  postgres:
    image: "${POSTGRES_IMAGE:-postgres:15}"
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core
      POSTGRES_DB: corememory
    ports:
      - '15432:5432'
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    networks:
      - runecore_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d corememory"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - '16379:6379'
    networks:
      - runecore_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  influx:
    image: influxdb:2.7
    ports:
      - '18086:8086'
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: runecore-admin
      DOCKER_INFLUXDB_INIT_ORG: runecore
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: runecore-dev-token
    volumes:
      - influx_data:/var/lib/influxdb2
    networks:
      - runecore_dev
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  core_memory:
    build: .
    ports:
      - '5010:5010'
    environment:
      - POSTGRES_DSN=postgresql://core:core@postgres:5432/corememory
      - REDIS_URL=redis://redis:6379/0
      - INFLUX_URL=http://influx:8086
      - INFLUX_TOKEN=runecore-dev-token
      - INFLUX_ORG=runecore
      - INFLUX_BUCKET=telemetry
      - ERRORLOGGER_SERVICE_URL=http://runeguard:5001/log
      - RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influx:
        condition: service_healthy
    networks:
      runecore_dev:
        aliases:
          - core_memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  core_pgdata:
  influx_data:

networks:
  runecore_dev:
    external: true
