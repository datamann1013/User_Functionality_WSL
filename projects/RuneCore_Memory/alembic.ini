[alembic]
# Anchor the migration tree to the directory containing this ini file so that
# `alembic -c <path>/alembic.ini ...` resolves the versions dir regardless of the
# current working directory — works in Docker (/app/alembic.ini -> /app/alembic)
# and from the module root (projects/RuneCore_Memory/).
script_location = %(here)s/alembic

[alembic:runtime]
# Use POSTGRES_DSN environment variable. If not set, Alembic/SQLAlchemy will need a url provided via
# command line. Example: export POSTGRES_DSN=postgresql://user:pw@host:5432/db
sqlalchemy.url = env:POSTGRES_DSN
