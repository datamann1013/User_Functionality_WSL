# RuneDev_Code configuration
# Copy to .runecode.toml in your project root, or to
# ~/.config/runecode/config.toml for a global default.

[model]
name        = "qwen2.5-coder:7b"   # Ollama model to use
wrapper_url = "http://localhost:5002"  # RuneCore_Mind Ollama wrapper
temperature = 0.2

[approval]
# Tools in auto_allow run silently without prompting
auto_allow = [
    "read_file",
    "list_directory",
    "search_files",
    "search_in_files",
    "git_status",
    "git_diff",
    "git_log",
]
# Tools in always_approve always show a [y/n/a/q] prompt
always_approve = [
    "write_file",
    "create_file",
    "delete_file",
    "run_bash",
    "git_commit",
]

[context]
max_file_size_kb = 100
project_context_files = [
    "README.md",
    "CLAUDE.md",
    "Cargo.toml",
    "package.json",
    "pyproject.toml",
    ".runecode.toml",
]
respect_gitignore = true

[security]
# Filesystem tools (read/write/create/delete/list) are confined to a sandbox
# root. Empty = the project root (cwd). Path traversal (`..`), absolute paths
# and symlink escapes that resolve outside the root are rejected.
sandbox_root        = ""
allow_outside_root  = false   # set true only if you trust the agent fully
# Extra regex patterns for run_bash, MERGED with the builtin denylist
# (rm -rf /, mkfs, dd of=/dev/, fork bombs, format C:, pipe-to-shell, shutdown).
shell_denylist      = []
# If non-empty, run_bash commands must match at least one of these regexes.
shell_allowlist     = []

[runecore]
register = true
core_url = "https://localhost:11440"  # Core HTTPS port (self-signed cert accepted)

# ---------------------------------------------------------------------------
# External MCP servers (optional)
# Connect to any MCP server that works with Claude Code CLI.
